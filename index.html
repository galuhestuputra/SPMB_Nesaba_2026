<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPMB 2026 - SMP Negeri 1 Banjar</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2c7a7b; --primary-light: #e6fffa; --bg-main: #f7fafc; --text-main: #2d3748; --success: #38a169; }
        body { font-family: 'Open Sans', sans-serif; background: var(--bg-main); color: var(--text-main); padding: 40px 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { color: var(--primary); }
        .download-box { background: var(--primary-light); border: 2px dashed var(--primary); padding: 20px; border-radius: 10px; display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
        .form-section { border: 1px solid #e2e8f0; padding: 25px; border-radius: 10px; margin-bottom: 30px; background: #fcfcfc; }
        h2 { font-size: 1.1em; border-bottom: 2px solid var(--primary-light); padding-bottom: 8px; margin-bottom: 20px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        label { font-weight: 600; font-size: 0.85em; margin-bottom: 5px; }
        input, select, textarea { padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; }
        .tka-box { background: #fffaf0; padding: 20px; border-radius: 10px; margin-bottom: 30px; border: 1px solid #feebc8; }
        button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .alert { display: none; padding: 20px; margin-top: 20px; border-radius: 8px; border: 1px solid #b2f5ea; background: #e6fffa; }
        .res-card { background: white; padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid #b2f5ea; text-align: left; }
        .res-card div { margin-bottom: 5px; }
        .highlight { color: var(--primary); font-weight: 700; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>SMP Negeri 1 Banjar</h1>
        <p>Pendaftaran Peserta Didik Baru Online 2026</p>
    </header>

    <div class="download-box">
        <div style="flex:1"><h3>Unduh Berkas</h3><p style="font-size:0.8em">Format Folder ZIP (Word & Panduan)</p></div>
        <a href="https://drive.google.com/uc?export=download&id=ID_FILE_ZIP_ANDA" style="background:#ed8936; color:white; padding:10px 20px; border-radius:6px; text-decoration:none; font-weight:700">📦 Download</a>
    </div>

    <form id="spmbForm">
        <div class="form-section">
            <h2>Data Pribadi</h2>
            <div class="form-grid">
                <div class="form-group"><label>Nama Lengkap</label><input type="text" name="nama" id="nama" required></div>
                <div class="form-group"><label>NISN</label><input type="number" name="nisn" required></div>
                <div class="form-group"><label>Jalur</label>
                    <select name="jalur" id="jalur" required>
                        <option value="Prestasi">Prestasi</option><option value="Afirmasi">Afirmasi</option>
                        <option value="Domisili">Domisili</option><option value="Mutasi">Mutasi</option>
                    </select>
                </div>
                <div class="form-group"><label>WhatsApp</label><input type="tel" name="hp" required></div>
                <div class="form-group" style="grid-column:span 2"><label>Alamat</label><textarea name="alamat" required></textarea></div>
            </div>
        </div>

        <div class="form-section">
            <h2>Nilai Rapor</h2>
            <div class="form-grid">
                <div class="form-group"><label>Agama</label><input type="number" step="00.01" name="nilai_agama" required></div>
                <div class="form-group"><label>Pancasila</label><input type="number" step="00.01" name="nilai_pancasila" required></div>
                <div class="form-group"><label>B. Indo</label><input type="number" step="00.01" name="nilai_bhs_indonesia" required></div>
                <div class="form-group"><label>MTK</label><input type="number" step="00.01" name="nilai_matematika" required></div>
                <div class="form-group"><label>IPAS</label><input type="number" step="00.01" name="nilai_ipas" required></div>
            </div>
        </div>

        <div class="tka-box">
            <h2>Nilai TKA</h2>
            <div class="form-grid">
                <div class="form-group"><label>TKA MTK</label><input type="number" step="0.01" name="nilai_tka_matematika" required></div>
                <div class="form-group"><label>TKA B. Indo</label><input type="number" step="0.01" name="nilai_tka_bahasa" required></div>
            </div>
        </div>

        <div class="form-section">
            <h2>Kejuaraan</h2>
            <div class="form-grid">
                <div class="form-group"><label>Nama Lomba</label><input type="text" name="nama_kejuaraan"></div>
                <div class="form-group"><label>Tingkat</label>
                    <select name="tingkat_kejuaraan">
                        <option value="-">-</option><option value="Internasional">Internasional</option>
                        <option value="Nasional">Nasional</option><option value="Provinsi">Provinsi</option>
                        <option value="Kota/Kab.">Kota/Kab.</option><option value="Kecamatan">Kecamatan</option>
                    </select>
                </div>
                <div class="form-group" style="grid-column:span 2"><label>Peringkat</label>
                    <select name="perolehan_kejuaraan">
                        <option value="-">-</option><option value="Juara I">Juara I</option>
                        <option value="Juara II">Juara II</option><option value="Juara III">Juara III</option>
                    </select>
                </div>
            </div>
        </div>

        <button type="submit" id="submitBtn">Kirim Pendaftaran</button>
    </form>

    <div id="successMsg" class="alert"></div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxJXF7a6FMM6Kd1n4YRgX8U8JWAblF2GQ8D-i5hnRMhEp9-pshtESgAglwO68HVSJ8Chg/exec';
    const form = document.getElementById('spmbForm');
    const btn = document.getElementById('submitBtn');
    const alertBox = document.getElementById('successMsg');

    form.addEventListener('submit', e => {
        e.preventDefault();
        btn.innerHTML = 'Memproses...'; btn.disabled = true;
        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
        .then(res => res.json())
        .then(res => {
            alertBox.innerHTML = `
                <div style="font-weight:700; color:var(--primary)">✨ PENDAFTARAN BERHASIL ✨</div>
                <div class="res-card">
                    <div>No. Pendaftaran: <span class="highlight">${res.no_reg}</span></div>
                    <div>Nama: <strong>${document.getElementById('nama').value}</strong></div>
                    <div>Jarak: <strong>${res.jarak} Meter</strong></div>
                    <div style="margin-top:10px; border-top:1px solid #eee; padding-top:10px;">
                        Skor Akademik Akhir: <span style="font-size:1.2em; color:#e53e3e; font-weight:700">${res.skor}</span>
                    </div>
                </div>
                <p style="font-size:0.8em; margin-top:10px">Skor dihitung dari: (Jml Rapor × 40%) + (Jml TKA × 60%)</p>
            `;
            alertBox.style.display = 'block';
            form.reset(); btn.innerHTML = 'Kirim Pendaftaran'; btn.disabled = false;
            alertBox.scrollIntoView({ behavior: 'smooth' });
        }).catch(() => { alert('Gagal terhubung ke server.'); btn.disabled = false; });
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Informasi SPMB 2026 - Pendaftaran Online</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2c7a7b; 
            --primary-dark: #236162; 
            --primary-light: #e6fffa; 
            --bg-main: #f7fafc; 
            --bg-card: #ffffff; 
            --text-main: #2d3748; 
            --text-muted: #718096; 
            --border-color: #e2e8f0; 
            --success: #38a169; 
            --error: #e53e3e; 
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Open Sans', sans-serif; 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            line-height: 1.6; 
            padding: 40px 20px;
        }

        .container { 
            max-width: 1000px; 
            margin: auto; 
            background: var(--bg-card); 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
        }
        
        header { text-align: center; margin-bottom: 40px; }
        header h1 { font-size: 2em; font-weight: 700; margin-bottom: 10px; }
        header .daya-tampung { 
            display: inline-block;
            background-color: var(--primary-light);
            color: var(--primary);
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9em;
        }
        
        h2 { 
            font-size: 1.4em; 
            margin-bottom: 20px; 
            display: flex;
            align-items: center;
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 10px;
        }
        h2::before {
            content: '';
            width: 4px;
            height: 20px;
            background-color: var(--primary);
            margin-right: 12px;
            border-radius: 2px;
        }

        /* Form Layout */
        .form-section { margin-bottom: 40px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        label { font-weight: 600; margin-bottom: 8px; font-size: 0.9em; }
        
        input, select, textarea { 
            padding: 12px; 
            border: 1px solid var(--border-color); 
            border-radius: 6px; 
            font-size: 0.95em; 
            transition: all 0.2s;
        }
        
        input:focus, select:focus, textarea:focus { 
            border-color: var(--primary); 
            outline: none; 
            box-shadow: 0 0 0 3px var(--primary-light); 
        }

        /* Grid Nilai */
        .grade-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 20px; 
        }

        /* Kejuaraan Grid */
        .champion-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 15px;
        }

        textarea { grid-column: span 2; }
        
        @media (max-width: 768px) {
            .form-grid, .champion-grid { grid-template-columns: 1fr; }
            textarea { grid-column: span 1; }
        }

        button { 
            width: 100%;
            padding: 16px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 1.1em; 
            font-weight: 700; 
            cursor: pointer; 
            transition: 0.3s;
            text-transform: uppercase;
        }
        
        button:hover { background: var(--primary-dark); }
        button:disabled { background: #cbd5e0; cursor: not-allowed; }

        .alert { 
            display: none; padding: 20px; margin-top: 30px; border-radius: 6px; 
            text-align: center; font-weight: 600;
        }
        .alert-success { background: #e6fffa; color: var(--success); border: 1px solid #b2f5ea; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Sistem Informasi SPMB 2026</h1>
        <p>Formulir Pendaftaran Siswa Baru Online</p>
        <span class="daya-tampung">Daya Tampung: 288 Siswa</span>
    </header>

    <form id="spmbForm">
        <div class="form-section">
            <h2>Data Pribadi</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" name="nama" id="nama" placeholder="Sesuai Akta" required>
                </div>
                <div class="form-group">
                    <label>NISN</label>
                    <input type="number" name="nisn" placeholder="10 Digit NISN" required>
                </div>
                <div class="form-group">
                    <label>Jalur Pendaftaran</label>
                    <select name="jalur" id="jalur" required>
                        <option value="">-- Pilih Jalur --</option>
                        <option value="Prestasi">Prestasi</option>
                        <option value="Afirmasi">Afirmasi</option>
                        <option value="Domisili">Domisili</option>
                        <option value="Mutasi">Mutasi</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Nomor WhatsApp</label>
                    <input type="tel" name="hp" placeholder="0812..." required>
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label>Alamat Lengkap</label>
                    <textarea name="alamat" placeholder="Alamat sesuai domisili saat ini..." required></textarea>
                </div>
            </div>
        </div>

        <div class="form-section">
            <h2>Nilai Rata-rata Mata Pelajaran</h2>
            <div class="grade-grid">
                <div class="form-group">
                    <label>Pend. Agama</label>
                    <input type="number" step="00.01" name="nilai_agama" placeholder="00.00" required>
                </div>
                <div class="form-group">
                    <label>Pend. Pancasila</label>
                    <input type="number" step="00.01" name="nilai_pancasila" placeholder="00.00" required>
                </div>
                <div class="form-group">
                    <label>Bhs. Indonesia</label>
                    <input type="number" step="00.01" name="nilai_bhs_indonesia" placeholder="00.00" required>
                </div>
                <div class="form-group">
                    <label>Matematika</label>
                    <input type="number" step="00.01" name="nilai_matematika" placeholder="00.00" required>
                </div>
                <div class="form-group">
                    <label>IPA</label>
                    <input type="number" step="00.01" name="nilai_ipa" placeholder="00.00" required>
                </div>
                <div class="form-group">
                    <label>IPS</label>
                    <input type="number" step="00.01" name="nilai_ips" placeholder="00.00" required>
                </div>
                <div class="form-group">
                    <label>IPAS</label>
                    <input type="number" step="00.01" name="nilai_ipas" placeholder="00.00" required>
                </div>
            </div>
        </div>

        <div class="form-section">
            <h2>Prestasi / Kejuaraan (Opsional)</h2>
            <div class="champion-grid">
                <div class="form-group">
                    <label>Nama Kejuaraan</label>
                    <input type="text" name="nama_kejuaraan" placeholder="Nama Lomba">
                </div>
                <div class="form-group">
                    <label>Tingkat</label>
                    <select name="tingkat_kejuaraan">
                        <option value="-">-</option>
                        <option value="Internasional">Internasional</option>
                        <option value="Nasional">Nasional</option>
                        <option value="Provinsi">Provinsi</option>
                        <option value="Kota">Kota</option>
                        <option value="Wilayah">Wilayah</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Juara Ke</label>
                    <select name="perolehan_kejuaraan">
                        <option value="-">-</option>
                        <option value="Juara I">Juara I</option>
                        <option value="Juara II">Juara II</option>
                        <option value="Juara III">Juara III</option>
                        <option value="Harapan I">Harapan I</option>
                        <option value="Harapan II">Harapan II</option>
                        <option value="Harapan III">Harapan III</option>
                    </select>
                </div>
            </div>
        </div>

        <button type="submit" id="submitBtn">Kirim Pendaftaran Online</button>
    </form>

    <div id="successMsg" class="alert alert-success"></div>
</div>

<script>
    // MASUKKAN URL WEB APP ANDA DI SINI
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxJXF7a6FMM6Kd1n4YRgX8U8JWAblF2GQ8D-i5hnRMhEp9-pshtESgAglwO68HVSJ8Chg/exec'; 
    
    const form = document.getElementById('spmbForm');
    const btnSubmit = document.getElementById('submitBtn');
    const alertBox = document.getElementById('successMsg');

    form.addEventListener('submit', e => {
        e.preventDefault();
        btnSubmit.innerHTML = 'Sedang Mengirim...';
        btnSubmit.disabled = true;

        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
        .then(response => response.json())
        .then(result => {
            const namaSiswa = document.getElementById('nama').value;
            alertBox.innerHTML = `Terima kasih <strong>${namaSiswa}</strong>! Pendaftaran berhasil.<br>Jarak rumah ke sekolah: <strong>${result.jarak} Meter</strong>.`;
            alertBox.style.display = 'block';
            form.reset();
            btnSubmit.innerHTML = 'Kirim Pendaftaran Online';
            btnSubmit.disabled = false;
            alertBox.scrollIntoView({ behavior: 'smooth' });
        })
        .catch(error => {
            alert('Gagal mengirim data. Cek URL Script dan Koneksi Internet.');
            btnSubmit.innerHTML = 'Kirim Pendaftaran Online';
            btnSubmit.disabled = false;
        });
    });
</script>

</body>
</html>

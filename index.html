<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPMB 2026 - SMPN 1 Banjar</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2c7a7b; --accent: #ed8936; --bg: #f7fafc; --border: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Open Sans', sans-serif; background: var(--bg); padding: 15px; color: #2d3748; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        header { display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid #e6fffa; padding-bottom: 15px; margin-bottom: 20px; }
        .header-logo img { height: 70px; }
        .header-text h1 { color: var(--primary); font-size: 1.3em; text-transform: uppercase; text-align: center; }

        .quota-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .quota-card { background: #fff; border: 1px solid var(--border); padding: 10px; border-radius: 8px; text-align: center; }
        .q-label { font-size: 0.65em; font-weight: 700; color: #718096; display: block; margin-bottom: 3px; }
        .q-val { font-size: 1.2em; font-weight: 800; color: var(--primary); }

        .form-sec { margin-bottom: 20px; padding: 20px; border: 1px solid var(--border); border-radius: 10px; background: #fcfcfc; }
        h2 { font-size: 0.9em; color: var(--primary); margin-bottom: 15px; border-left: 4px solid var(--primary); padding-left: 10px; text-transform: uppercase; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: 600; font-size: 0.8em; margin-bottom: 4px; color: #4a5568; }
        input, select, textarea { padding: 8px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 0.9em; }

        .btn-act { padding: 10px 15px; border-radius: 6px; font-weight: 700; cursor: pointer; border: none; text-decoration: none; font-size: 0.8em; transition: 0.3s; }
        .btn-submit { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 1em; margin-top: 10px; }

        .card-print { background: #fff; border: 2px solid #333; padding: 20px; border-radius: 8px; margin-top: 20px; display: none; max-width: 500px; margin-inline: auto; }
        
        @media print {
            body * { visibility: hidden; }
            #printable, #printable * { visibility: visible; }
            #printable { position: absolute; left: 0; top: 0; width: 100%; border: none; }
            .no-print { display: none; }
        }
    </style>
</head>

        <div class="header-text"><h1>SMP Negeri 1 Banjar</h1><p>PPDB Online 2026</p></div>
    </header>

    <!-- CEK KARTU / LOGIN -->
    <div class="form-sec" style="border: 2px solid var(--primary); background: var(--primary-light);">
        <h2>Sudah Daftar? Cetak Kartu</h2>
        <div style="display: flex; gap: 10px;">
            <input type="number" id="nik_login" placeholder="Masukkan NIK 16 Digit" style="flex: 1;">
            <button onclick="cekKartu()" class="btn-act" style="background:var(--primary); color:white;">CEK DATA</button>
        </div>
    </div>

    <div id="printable" class="card-print">
        <div style="text-align:center; border-bottom:2px solid #000; margin-bottom:10px; padding-bottom:10px;">
            <h3 style="margin:0">KARTU PESERTA PPDB 2026</h3>
            <p style="margin:0; font-size:0.8em;">SMP NEGERI 1 BANJAR</p>
        </div>
        <div style="line-height: 1.6; font-size:0.9em;">
            No. Registrasi: <strong id="res_noreg"></strong><br>
            Nama Lengkap: <strong id="res_nama"></strong><br>
            Nama Ortu: <span id="res_ortu"></span><br>
            Jalur: <span id="res_jalur"></span><br>
            Skor Akhir: <strong id="res_skor"></strong>
        </div>
        <div style="margin-top:15px; text-align:right;">
            <button onclick="window.print()" class="btn-act no-print" style="background:#444; color:white;">Cetak Kartu</button>
        </div>
    </div>

    <!-- KUOTA -->
    <div class="quota-grid" id="quotaDisplay">
        <div class="quota-card"><span class="q-label">PRESTASI</span><span class="q-val" id="q-Prestasi">...</span></div>
        <div class="quota-card"><span class="q-label">AFIRMASI</span><span class="q-val" id="q-Afirmasi">...</span></div>
        <div class="quota-card"><span class="q-label">DOMISILI</span><span class="q-val" id="q-Domisili">...</span></div>
        <div class="quota-card"><span class="q-label">MUTASI</span><span class="q-val" id="q-Mutasi">...</span></div>
    </div>

    <!-- FORM PENDAFTARAN -->
    <form id="regForm">
        <div class="form-sec">
            <h2>Formulir Pendaftaran Baru</h2>
            <div class="grid">
                <div class="form-group"><label>Nama Siswa</label><input type="text" name="nama" required></div>
                <div class="form-group"><label>Nama Orang Tua</label><input type="text" name="nama_ortu" required></div>
                <div class="form-group"><label>NIK</label><input type="number" name="nik" required></div>
                <div class="form-group"><label>Jalur</label>
                    <select name="jalur" id="jalur_select" required>
                        <option value="Prestasi">Prestasi</option>
                        <option value="Afirmasi">Afirmasi</option>
                        <option value="Domisili">Domisili</option>
                        <option value="Mutasi">Mutasi</option>
                    </select>
                </div>
                <div class="form-group"><label>WhatsApp</label><input type="tel" name="hp" required></div>
                <div class="form-group" style="grid-column: span 2;"><label>Alamat</label><textarea name="alamat" required></textarea></div>
            </div>
            <!-- Hidden inputs for scores and zonasi -->
            <input type="hidden" name="latitude" value=""><input type="hidden" name="longitude" value=""><input type="hidden" name="jarak" value="0">
            <!-- (Tambahkan input nilai Agama_1 sampai IPAS_5 secara manual atau via loop seperti sebelumnya) -->
        </div>
        <button type="submit" class="btn-submit" id="btnSub">KIRIM PENDAFTARAN</button>
    </form>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxJXF7a6FMM6Kd1n4YRgX8U8JWAblF2GQ8D-i5hnRMhEp9-pshtESgAglwO68HVSJ8Chg/exec';

    // 1. Fungsi Cek Kartu (Login)
    function cekKartu() {
        const nik = document.getElementById('nik_login').value;
        if(nik.length < 10) return alert("Masukkan NIK yang valid!");
        
        const btn = event.target; btn.innerText = "Mencari...";
        const fd = new FormData(); fd.append('action', 'checkNIK'); fd.append('nik_login', nik);

        fetch(scriptURL, { method: 'POST', body: fd })
        .then(res => res.json())
        .then(res => {
            btn.innerText = "CEK DATA";
            if(res.result === 'found') {
                document.getElementById('res_noreg').innerText = res.data.no_reg;
                document.getElementById('res_nama').innerText = res.data.nama;
                document.getElementById('res_ortu').innerText = res.data.ortu;
                document.getElementById('res_jalur').innerText = res.data.jalur;
                document.getElementById('res_skor').innerText = parseFloat(res.data.skor).toFixed(2);
                document.getElementById('printable').style.display = 'block';
            } else { alert("Data tidak ditemukan."); }
        });
    }

    // 2. Load Quota
    window.onload = () => {
        fetch(scriptURL).then(res => res.json()).then(data => {
            for(let j in data) { document.getElementById('q-'+j).innerText = data[j]; }
        });
    };

    // 3. Submit Form
    document.getElementById('regForm').addEventListener('submit', e => {
        e.preventDefault();
        const b = document.getElementById('btnSub'); b.disabled = true; b.innerText = 'Mengirim...';
        fetch(scriptURL, { method: 'POST', body: new FormData(e.target) })
        .then(res => res.json()).then(res => {
            alert("Pendaftaran Berhasil! Silakan cek NIK Anda di atas untuk cetak kartu.");
            location.reload();
        });
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPMB 2026 - SMP Negeri 1 Banjar</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2c7a7b; 
            --primary-dark: #236162; 
            --primary-light: #e6fffa; 
            --bg-main: #f7fafc; 
            --bg-card: #ffffff; 
            --text-main: #2d3748; 
            --text-muted: #718096; 
            --border-color: #e2e8f0; 
            --success: #38a169; 
            --accent: #ed8936; 
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Open Sans', sans-serif; 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            line-height: 1.6; 
            padding: 20px;
        }

        .container { 
            max-width: 1000px; 
            margin: auto; 
            background: var(--bg-card); 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
        }
        
        /* === HEADER DENGAN LOGO & FOTO === */
        header { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            margin-bottom: 30px; 
            padding-bottom: 20px;
            border-bottom: 3px solid var(--primary-light);
            gap: 20px;
        }

        .header-logo, .header-photo {
            flex-shrink: 0;
        }

        .header-logo img {
            height: 100px; /* Ukuran Logo */
            width: auto;
            object-fit: contain;
        }

        .header-photo img {
            height: 100px; /* Ukuran Foto */
            width: 100px;
            object-fit: cover;
            border-radius: 50%; /* Membuat foto melingkar */
            border: 3px solid var(--primary-light);
        }

        .header-text { 
            text-align: center; 
            flex-grow: 1;
        }

        .header-text h1 { 
            font-size: 1.8em; 
            font-weight: 700; 
            color: var(--primary); 
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .header-text p { color: var(--text-muted); font-size: 1em; }

        .badge { 
            display: inline-block; background: var(--primary-light); color: var(--primary);
            padding: 5px 15px; border-radius: 50px; font-weight: 700; font-size: 0.85em;
            margin-top: 5px;
        }

        /* Menu Download */
        .download-box {
            background-color: var(--primary-light);
            border: 2px dashed var(--primary);
            padding: 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            margin-bottom: 40px;
            gap: 20px;
        }
        
        .btn-download {
            background-color: var(--accent);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.9em;
            transition: 0.3s;
        }

        /* Form Styling */
        .form-section { 
            margin-bottom: 30px; 
            padding: 25px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background-color: #fcfcfc;
        }
        
        h2 { 
            font-size: 1.1em; margin-bottom: 20px; color: var(--text-main);
            display: flex; align-items: center; border-bottom: 2px solid var(--primary-light); padding-bottom: 8px;
        }
        h2::before { content: ''; width: 5px; height: 25px; background-color: var(--primary); margin-right: 12px; border-radius: 2px; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        label { font-weight: 600; margin-bottom: 5px; font-size: 0.9em; }
        
        input, select, textarea { padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.95em; }

        .tka-box { background-color: #fffaf0; border: 1px solid #feebc8; padding: 25px; border-radius: 10px; margin-bottom: 30px; }

        button#submitBtn { 
            width: 100%; padding: 18px; background: var(--primary); color: white; border: none; 
            border-radius: 8px; font-size: 1.1em; font-weight: 700; cursor: pointer; transition: 0.3s;
        }
        button#submitBtn:hover { background: var(--primary-dark); }

        /* Tampilan Hasil */
        .alert { display: none; padding: 25px; margin-top: 30px; border-radius: 8px; text-align: center; }
        .alert-success { background: #e6fffa; color: var(--success); border: 1px solid #b2f5ea; }
        .res-card { background: white; padding: 20px; border-radius: 10px; margin-top: 15px; text-align: left; border: 1px solid #b2f5ea; }
        .score-highlight { color: #e53e3e; font-size: 1.5em; font-weight: 800; }

        @media (max-width: 768px) {
            header { flex-direction: column; text-align: center; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-logo">
            <!-- GANTI DENGAN ID LOGO SEKOLAH ANDA -->
            <img src="https://lh3.googleusercontent.com/d/1lvi4Lnmfyuh6SatSKfWhwtTi16ggJqLD" alt="Logo SMPN 1 Banjar">
        </div>
        
        <div class="header-text">
            <h1>SMP Negeri 1 Banjar</h1>
            <p>Pendaftaran Peserta Didik Baru Online 2026</p>
            <span class="badge">Aplikasi Resmi SPMB</span>
        </div>

        <div class="header-photo">
            <!-- GANTI DENGAN ID FOTO SEKOLAH/MASKOT ANDA -->
            <img src="https://lh3.googleusercontent.com/d/1_M3X9kCrGGlzbG63cYaIgRqfL7p18jFF" alt="Foto Sekolah">
        </div>
    </header>

    <div class="download-box">
        <div style="flex: 1;">
            <h3>Unduh Paket Berkas</h3>
            <p>Silakan unduh formulir pendaftaran fisik dalam format ZIP.</p>
        </div>
        <a href="https://drive.google.com/uc?export=download&id=1J4LMw6o3j2AhW6JPJAPLx4ttXCmAUIpn" class="btn-download">📦 Download ZIP</a>
    </div>

    <form id="spmbForm">
        <div class="form-section">
            <h2>Data Pribadi Calon Siswa</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" name="nama" id="nama" placeholder="Sesuai Ijazah" required>
                </div>
                <div class="form-group">
                    <label>NISN (10 Digit)</label>
                    <input type="number" name="nisn" required>
                </div>
                <div class="form-group">
                    <label>Jalur Pendaftaran</label>
                    <select name="jalur" id="jalur" required>
                        <option value="">-- Pilih Jalur --</option>
                        <option value="Prestasi">Jalur Prestasi (P)</option>
                        <option value="Afirmasi">Jalur Afirmasi (A)</option>
                        <option value="Domisili">Jalur Domisili (D)</option>
                        <option value="Mutasi">Jalur Mutasi (M)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Nomor WhatsApp</label>
                    <input type="tel" name="hp" placeholder="08xxxxxxxxxx" required>
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label>Alamat Domisili Lengkap</label>
                    <textarea name="alamat" required placeholder="Tuliskan alamat lengkap untuk verifikasi zonasi..."></textarea>
                </div>
            </div>
        </div>

        <div class="form-section">
            <h2>Nilai Rata-rata Rapor (Smt 1-5)</h2>
            <div class="grade-grid">
                <div class="form-group"><label>Agama</label><input type="number" step="0.01" name="nilai_agama" required></div>
                <div class="form-group"><label>Pancasila</label><input type="number" step="0.01" name="nilai_pancasila" required></div>
                <div class="form-group"><label>B. Indo</label><input type="number" step="0.01" name="nilai_bhs_indonesia" required></div>
                <div class="form-group"><label>MTK</label><input type="number" step="0.01" name="nilai_matematika" required></div>
                <div class="form-group"><label>IPAS</label><input type="number" step="0.01" name="nilai_ipas" required></div>
            </div>
        </div>

        <div class="tka-box">
            <h2>Hasil Tes Kemampuan Akademik (TKA)</h2>
            <div class="form-grid">
                <div class="form-group"><label>TKA Matematika</label><input type="number" step="0.01" name="nilai_tka_matematika" required></div>
                <div class="form-group"><label>TKA B. Indo</label><input type="number" step="0.01" name="nilai_tka_bahasa" required></div>
            </div>
        </div>

        <div class="form-section">
            <h2>Prestasi / Kejuaraan</h2>
            <div class="form-grid">
                <div class="form-group"><label>Nama Lomba</label><input type="text" name="nama_kejuaraan"></div>
                <div class="form-group">
                    <label>Tingkat</label>
                    <select name="tingkat_kejuaraan">
                        <option value="-">-</option>
                        <option value="Internasional">Internasional</option>
                        <option value="Nasional">Nasional</option>
                        <option value="Provinsi">Provinsi</option>
                        <option value="Kota/Kab.">Kota/Kab.</option>
                        <option value="Kecamatan">Kecamatan</option>
                    </select>
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label>Peringkat</label>
                    <select name="perolehan_kejuaraan">
                        <option value="-">-</option>
                        <option value="Juara I">Juara I</option>
                        <option value="Juara II">Juara II</option>
                        <option value="Juara III">Juara III</option>
                    </select>
                </div>
            </div>
        </div>

        <button type="submit" id="submitBtn">Kirim Pendaftaran Online</button>
    </form>

    <div id="successMsg" class="alert alert-success"></div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxJXF7a6FMM6Kd1n4YRgX8U8JWAblF2GQ8D-i5hnRMhEp9-pshtESgAglwO68HVSJ8Chg/exec'; 
    const form = document.getElementById('spmbForm');
    const btnSubmit = document.getElementById('submitBtn');
    const alertBox = document.getElementById('successMsg');

    function formatIndo(angka) {
        return parseFloat(angka).toLocaleString('id-ID', { 
            minimumFractionDigits: 2, 
            maximumFractionDigits: 2 
        });
    }

    form.addEventListener('submit', e => {
        e.preventDefault();
        btnSubmit.innerHTML = 'Sedang Mengirim...';
        btnSubmit.disabled = true;

        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
        .then(response => response.json())
        .then(result => {
            const namaSiswa = document.getElementById('nama').value;
            alertBox.innerHTML = `
                <div style="font-size: 1.5em; margin-bottom: 15px; font-weight:700;">✨ PENDAFTARAN BERHASIL ✨</div>
                <div class="res-card">
                    <div>No. Pendaftaran: <strong>${result.no_reg}</strong></div>
                    <div>Nama: <strong>${namaSiswa}</strong></div>
                    <div>NISN: <strong>${result.nisn}</strong></div>
                    <div>Jarak: <strong>${result.jarak} Meter</strong></div>
                    <div style="margin-top: 15px; border-top: 1px dashed #cbd5e0; padding-top: 10px;">
                        Skor Akademik Akhir (40:60): <br>
                        <span class="score-highlight">${formatIndo(result.skor)}</span>
                    </div>
                </div>
                <p style="font-size: 0.85em; margin-top: 15px;">Simpan bukti ini untuk verifikasi berkas selanjutnya.</p>
            `;
            alertBox.style.display = 'block';
            form.reset();
            btnSubmit.innerHTML = 'Kirim Pendaftaran Online';
            btnSubmit.disabled = false;
            alertBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
        })
        .catch(error => {
            alert('Gagal mengirim pendaftaran. Cek koneksi atau URL Script.');
            btnSubmit.innerHTML = 'Kirim Pendaftaran Online';
            btnSubmit.disabled = false;
        });
    });
</script>

</body>
</html>

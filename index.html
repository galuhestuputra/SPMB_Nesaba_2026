<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPMB 2026 - Sistem Pendaftaran</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --success: #27ae60;
            --bg: #f4f7f6;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2 { color: var(--primary); text-align: center; }
        
        /* Tabel Kuota */
        table { width: 100%; border-collapse: collapse; margin: 20px 0; background: #fff; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: var(--primary); color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }

        /* Form */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; color: #555; }
        input, select, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        textarea { grid-column: span 2; height: 80px; }
        
        button { 
            grid-column: span 2; padding: 15px; background: var(--secondary); color: white; 
            border: none; border-radius: 5px; font-size: 16px; cursor: pointer; transition: 0.3s;
        }
        button:hover { background: #2980b9; }
        button:disabled { background: #95a5a6; cursor: not-allowed; }

        .alert { 
            display: none; padding: 15px; margin-top: 20px; border-radius: 5px; 
            text-align: center; font-weight: bold;
        }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>

<div class="container">
    <h1>Sistem Informasi SPMB 2026</h1>
    <p style="text-align: center;">Total Daya Tampung: <strong>288 Siswa</strong></p>

    <!-- Tabel Rincian Jalur -->
    <h2>Distribusi Kuota Jalur Masuk</h2>
    <table>
        <thead>
            <tr>
                <th>Jalur Masuk</th>
                <th>Persentase</th>
                <th>Kuota (Siswa)</th>
            </tr>
        </thead>
        <tbody>
            <tr><td>Jalur Prestasi</td><td>35%</td><td>101</td></tr>
            <tr><td>Jalur Afirmasi</td><td>20%</td><td>58</td></tr>
            <tr><td>Jalur Domisili</td><td>40%</td><td>115</td></tr>
            <tr><td>Jalur Mutasi</td><td>5%</td><td>14</td></tr>
            <tr style="font-weight: bold; background: #eee;"><td colspan="2">TOTAL</td><td>288</td></tr>
        </tbody>
    </table>

    <hr>

    <!-- Formulir Pendaftaran -->
    <h2>Formulir Pendaftaran Online</h2>
    <form id="spmbForm" class="form-grid">
        <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
        </div>
        <div class="form-group">
            <label>NISN</label>
            <input type="number" id="nisn" name="nisn" placeholder="Nomor Induk Siswa Nasional" required>
        </div>
        <div class="form-group">
            <label>Jalur Pendaftaran</label>
            <select id="jalur" name="jalur" required>
                <option value="">-- Pilih Jalur --</option>
                <option value="Prestasi">Prestasi</option>
                <option value="Afirmasi">Afirmasi</option>
                <option value="Domisili">Domisili</option>
                <option value="Mutasi">Mutasi</option>
            </select>
        </div>
        <div class="form-group">
            <label>Nomor HP Orang Tua</label>
            <input type="tel" id="hp" name="hp" placeholder="Contoh: 0812..." required>
        </div>
        <textarea id="alamat" name="alamat" placeholder="Alamat Lengkap Domisili" required></textarea>
        
        <button type="submit" id="submitBtn">Kirim Pendaftaran</button>
    </form>

    <div id="successMsg" class="alert alert-success"></div>
</div>

<!-- BAGIAN JAVASCRIPT UNTUK KONEKSI KE GOOGLE SHEETS -->
<script>
    // 1. MASUKKAN URL WEB APP DARI GOOGLE APPS SCRIPT DI SINI
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxTGibnlXnVeXtY2T6on8FbxDsvgZw-rQoYtZxXCrUDhAJd54eaz8PfEuxkNHzKFmaWkg/exec'; 
    
const form = document.getElementById('spmbForm');
    const btnSubmit = document.getElementById('submitBtn');
    const alertBox = document.getElementById('successMsg');

    form.addEventListener('submit', e => {
        // Mencegah halaman refresh otomatis
        e.preventDefault(); 
        
        // Mengunci tombol agar tidak diklik dua kali
        btnSubmit.innerHTML = 'Sedang Memproses...';
        btnSubmit.disabled = true;

        // Mengirim data
        fetch(scriptURL, { 
            method: 'POST', 
            body: new FormData(form)
        })
        .then(response => response.json()) // Menunggu respon format JSON
        .then(result => {
            if (result.result === 'success') {
                // Tampilkan Pesan Sukses dan Koordinat
                alertBox.innerHTML = `
                    <strong>Pendaftaran Berhasil!</strong><br>
                    Nama: ${document.getElementById('nama').value}<br>
                    Jarak ke Sekolah: <strong>${result.jarak} Meter</strong>
                `;
                alertBox.className = 'alert alert-success';
                alertBox.style.display = 'block';
                
                // RESET FORMULIR HANYA SETELAH DATA BERHASIL TERKIRIM
                form.reset();
            } else {
                alert('Gagal menyimpan: ' + result.error);
            }
        })
        .catch(error => {
            console.error('Error!', error.message);
            alert('Terjadi kesalahan! Pastikan URL Script benar dan Anda sudah "Deploy" sebagai "Anyone".');
        })
        .finally(() => {
            // Mengembalikan tombol ke kondisi semula
            btnSubmit.innerHTML = 'Kirim Pendaftaran';
            btnSubmit.disabled = false;
            alertBox.scrollIntoView({ behavior: 'smooth' });
        });
    });
	</script>

</body>
</html>
